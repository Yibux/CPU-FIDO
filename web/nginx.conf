# Za tunelem TLS kończy się w cloudflared – przekazujemy dalej oryginalny schemat,
# żeby API wiedziało, że może ustawić cookie Secure.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Nagłówki bezpieczeństwa (dyrektywy add_header są tylko tutaj, więc dziedziczą je wszystkie location).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "publickey-credentials-get=(self), publickey-credentials-create=(self)" always;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        # Zmienna + resolver Dockera: nginx odpytuje DNS na bieżąco,
        # więc przeżywa restart/odtworzenie kontenera api (zmiana IP).
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
